services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sieve
      POSTGRES_PASSWORD: sieve
      POSTGRES_DB: sieve
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sieve"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./apps/server
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://sieve:sieve@db:5432/sieve
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: ./apps/server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://sieve:sieve@db:5432/sieve
    volumes:
      - ./apps/server/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingest:
    build:
      context: ./apps/server
    command: ["uv", "run", "python", "-m", "app.ingest.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://sieve:sieve@db:5432/sieve
      CASPIAN_API_KEY: ${CASPIAN_API_KEY}
      CASPIAN_BASE_URL: ${CASPIAN_BASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./apps/server/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://server:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./apps/client/src:/repo/apps/client/src
    depends_on:
      - server

volumes:
  db-data:
