services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sieve
      POSTGRES_PASSWORD: sieve
      POSTGRES_DB: sieve
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sieve"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./apps/server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://sieve:sieve@db:5432/sieve
    volumes:
      - ./apps/server/app:/app/app
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://server:8000
    volumes:
      - ./apps/client/src:/repo/apps/client/src
    depends_on:
      - server

volumes:
  db-data:
